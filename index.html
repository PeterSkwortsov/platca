<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кванториум | Мастер-классы</title>
    <style>
        /* --- БАЗОВЫЕ СТИЛИ И ПЕРЕМЕННЫЕ --- */
        :root {
            --orange: #F58220;
            --blue: #2E5A9C;
            --white: #ffffff;
            --dark: #1a1a1a;
            --gray: #f4f4f4;
            --purple: #7B2FBE;
            --violet: #9B4DCA;
            --deep-blue: #2E5A9C;
            --gradient-main: linear-gradient(135deg, #7B2FBE 0%, #2E5A9C 100%);
            --gradient-hover: linear-gradient(135deg, #9B4DCA 0%, #3D6FB8 100%);
            --gradient-text: linear-gradient(135deg, #7B2FBE 0%, #2E5A9C 100%);
            --font-main: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--white);
            color: var(--dark);
            line-height: 1.6;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* --- ВИДЕО-БЛОК --- */
        .video-hero {
            position: relative;
            width: 100%;
            height: 100vh;
            min-height: 500px;
            overflow: hidden;
            background-color: #000;
        }

        .video-hero.hidden {
            display: none;
        }

        .video-hero video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover;
            z-index: 1;
        }

        /* --- ДЕКОРАТИВНЫЕ ФИГУРЫ --- */
        .quote-decor {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            overflow: hidden;
        }

        .quote-decor>div {
            opacity: 0;
            transform: translateY(30px) scale(0.8);
            transition: opacity 1.2s ease-out, transform 1.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .quote-decor.visible>div {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .quote-decor.visible .decor-circle {
            transition-delay: 0s;
        }

        .quote-decor.visible .decor-ring {
            transition-delay: 0.3s;
        }

        .quote-decor.visible .decor-triangle {
            transition-delay: 0.6s;
        }

        .quote-decor.visible .decor-dot {
            transition-delay: 0.9s;
        }

        .quote-decor.visible .decor-hex {
            transition-delay: 1.2s;
        }

        .quote-decor .decor-circle {
            position: absolute;
            top: 10%;
            right: -5%;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(123, 47, 190, 0.45) 0%, rgba(46, 90, 156, 0.15) 60%, transparent 80%);
            filter: blur(2px);
        }

        .quote-decor .decor-ring {
            position: absolute;
            bottom: 5%;
            left: -8%;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            border: 8px solid transparent;
            background: linear-gradient(135deg, rgba(123, 47, 190, 0.7), rgba(46, 90, 156, 0.7)) border-box;
            -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
        }

        .quote-decor .decor-triangle {
            position: absolute;
            top: 15%;
            left: 5%;
            width: 180px;
            height: 180px;
            background: linear-gradient(135deg, rgba(123, 47, 190, 0.55) 0%, rgba(46, 90, 156, 0.55) 100%);
            clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
            filter: blur(1px);
        }

        .quote-decor .decor-dot {
            position: absolute;
            bottom: 20%;
            right: 15%;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 40%, rgba(155, 77, 202, 0.6), rgba(46, 90, 156, 0.3) 70%, transparent 100%);
            filter: blur(3px);
        }

        .quote-decor .decor-hex {
            position: absolute;
            top: 50%;
            right: 3%;
            width: 150px;
            height: 150px;
            background: linear-gradient(45deg, rgba(123, 47, 190, 0.45), rgba(46, 90, 156, 0.45));
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            filter: blur(1px);
        }

        .quote-decor.visible .decor-circle {
            animation: floatCircle 12s ease-in-out 1.5s infinite;
        }

        .quote-decor.visible .decor-ring {
            animation: floatRing 15s ease-in-out 1.5s infinite reverse;
        }

        .quote-decor.visible .decor-triangle {
            animation: floatTriangle 10s ease-in-out 1.5s infinite;
        }

        .quote-decor.visible .decor-dot {
            animation: floatDot 8s ease-in-out 1.5s infinite;
        }

        .quote-decor.visible .decor-hex {
            animation: floatHex 14s ease-in-out 1.5s infinite reverse;
        }

        @keyframes floatCircle {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(-20px, 20px) scale(1.05);
            }
        }

        @keyframes floatRing {

            0%,
            100% {
                transform: translate(0, 0) rotate(0deg);
            }

            50% {
                transform: translate(20px, -15px) rotate(180deg);
            }
        }

        @keyframes floatTriangle {

            0%,
            100% {
                transform: translate(0, 0) rotate(0deg);
            }

            50% {
                transform: translate(15px, 20px) rotate(-20deg);
            }
        }

        @keyframes floatDot {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(-15px, -20px) scale(1.15);
            }
        }

        @keyframes floatHex {

            0%,
            100% {
                transform: translate(0, 0) rotate(0deg);
            }

            50% {
                transform: translate(-10px, 15px) rotate(30deg);
            }
        }

        /* --- ЦИТАТА --- */
        .quote-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.95);
            z-index: 3;
            text-align: center;
            max-width: 900px;
            padding: 2rem 3rem;
            opacity: 0;
            transition: opacity 2s ease-in-out, transform 2s ease-in-out;
            pointer-events: none;
        }

        .quote-overlay.visible {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .quote-overlay .quote-text {
            font-size: 1.6rem;
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 2rem;
            color: var(--dark);
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.5);
        }

        .quote-overlay .quote-author {
            font-size: 1.1rem;
            font-weight: 700;
            line-height: 1.4;
            background: var(--gradient-text);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }

        .quote-overlay .quote-author span {
            display: block;
            font-weight: 500;
            font-size: 1rem;
            margin-top: 0.3rem;
            background: var(--gradient-text);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }

        /* --- ГЛАВНАЯ СТРАНИЦА --- */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .page-title {
            text-align: center;
            margin: 3rem 0;
            font-size: 2.5rem;
            text-transform: uppercase;
            font-weight: 800;
            background: var(--gradient-text);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            display: inline-block;
            width: 100%;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-bottom: 4rem;
        }

        .card {
            background: var(--white);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(123, 47, 190, 0.15);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            position: relative;
            border: 2px solid transparent;
            background-clip: padding-box;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 12px;
            padding: 2px;
            background: var(--gradient-main);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            z-index: 3;
            opacity: 0.6;
            transition: opacity 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(123, 47, 190, 0.3);
        }

        .card:hover::before {
            opacity: 1;
        }

        .card-image {
            height: 200px;
            background-size: cover;
            background-position: center;
            position: relative;
            background-color: #ddd;
        }

        .card-image::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(180deg, rgba(123, 47, 190, 0.1) 0%, rgba(46, 90, 156, 0.3) 100%);
        }

        .card-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: var(--gradient-main);
            color: var(--white);
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.8rem;
            text-transform: uppercase;
            z-index: 2;
            box-shadow: 0 4px 10px rgba(123, 47, 190, 0.3);
        }

        .card-content {
            padding: 1.5rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .card-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            line-height: 1.3;
            background: var(--gradient-text);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }

        .card-desc {
            color: #666;
            margin-bottom: 1.5rem;
            flex-grow: 1;
            font-size: 0.95rem;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #eee;
            padding-top: 1rem;
            font-weight: 600;
        }

        .price {
            background: var(--gradient-text);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            font-size: 1.1rem;
            font-weight: 700;
        }

        /* --- СТРАНИЦА НАПРАВЛЕНИЯ --- */
        .direction-page {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .direction-page.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hero-banner {
            border-radius: 12px;
            padding: 3rem;
            color: var(--white);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            align-items: center;
            position: relative;
            overflow: hidden;
            margin-bottom: 3rem;
        }

        .hero-banner::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: radial-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 20px 20px;
            pointer-events: none;
        }

        .hero-banner.orange {
            background-color: var(--orange);
        }

        .hero-banner.blue {
            background-color: var(--blue);
        }

        .hero-banner .bg-graphic {
            position: absolute;
            top: -50px;
            right: -50px;
            width: 400px;
            height: 400px;
            border: 20px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            pointer-events: none;
        }

        .hero-text h1 {
            font-size: 2.2rem;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
            line-height: 1.2;
        }

        .hero-text p {
            font-size: 1.1rem;
            margin-bottom: 2rem;
            opacity: 0.95;
        }

        /* --- СЛАЙДЕР В КАРТОЧКЕ НАПРАВЛЕНИЯ --- */
        .hero-slider {
            position: relative;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            background-color: rgba(255, 255, 255, 0.1);
            aspect-ratio: 4 / 3;
        }

        .slider-track {
            display: flex;
            height: 100%;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .slide {
            min-width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            color: var(--white);
            font-weight: 800;
            font-size: 2rem;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        /* Градиентные заглушки для слайдов */
        .slide-1 {
            background: linear-gradient(135deg, #7B2FBE 0%, #2E5A9C 100%);
        }

        .slide-2 {
            background: linear-gradient(135deg, #9B4DCA 0%, #3D6FB8 100%);
        }

        .slide-3 {
            background: linear-gradient(135deg, #2E5A9C 0%, #7B2FBE 100%);
        }

        .slide-4 {
            background: linear-gradient(135deg, #6B3FA0 0%, #4A7BC8 100%);
        }

        .slide::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(255, 255, 255, 0.15) 1px, transparent 1px);
            background-size: 20px 20px;
            pointer-events: none;
        }

        /* Кнопки навигации слайдера */
        .slider-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(8px);
            border: 2px solid rgba(255, 255, 255, 0.4);
            color: var(--white);
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s, transform 0.2s;
            z-index: 4;
            user-select: none;
        }

        .slider-btn:hover {
            background: rgba(255, 255, 255, 0.45);
            transform: translateY(-50%) scale(1.1);
        }

        .slider-btn.prev {
            left: 15px;
        }

        .slider-btn.next {
            right: 15px;
        }

        /* Точки-индикаторы */
        .slider-dots {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 4;
        }

        .slider-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.6);
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }

        .slider-dot.active {
            background: var(--white);
            transform: scale(1.2);
        }

        /* Счётчик слайдов */
        .slider-counter {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(8px);
            color: var(--white);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            z-index: 4;
        }

        .hero-badge {
            display: inline-block;
            border: 2px solid var(--white);
            padding: 5px 20px;
            border-radius: 30px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }

        .info-box {
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid var(--white);
            border-radius: 8px;
            padding: 1rem 2rem;
            display: inline-block;
            margin-top: 1rem;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 2rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s;
            background: var(--gradient-text);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }

        .back-btn:hover {
            opacity: 0.7;
        }

        .program-details {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 3rem;
        }

        .program-details h2 {
            font-size: 1.6rem;
            margin-bottom: 1rem;
            text-transform: uppercase;
            background: var(--gradient-text);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            display: inline-block;
        }

        .program-details ul {
            list-style: none;
            margin-bottom: 2rem;
        }

        .program-details li {
            margin-bottom: 0.8rem;
            padding-left: 1.5rem;
            position: relative;
        }

        .program-details li::before {
            content: '✓';
            position: absolute;
            left: 0;
            background: var(--gradient-text);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            font-weight: bold;
        }

        .sidebar {
            background: var(--white);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(123, 47, 190, 0.15);
            height: fit-content;
            position: relative;
            border: 2px solid transparent;
            background-clip: padding-box;
        }

        .sidebar::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 12px;
            padding: 2px;
            background: var(--gradient-main);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            opacity: 0.5;
        }

        .sidebar h3 {
            margin-bottom: 1rem;
            font-size: 1.3rem;
            background: var(--gradient-text);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            display: inline-block;
        }

        .sidebar p {
            margin-bottom: 1rem;
            color: #555;
        }

        .btn-gradient {
            display: block;
            width: 100%;
            padding: 12px;
            background: var(--gradient-main);
            color: var(--white);
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
            text-align: center;
            text-decoration: none;
            transition: background 0.3s, transform 0.2s, box-shadow 0.3s;
            box-shadow: 0 4px 15px rgba(123, 47, 190, 0.3);
        }

        .btn-gradient:hover {
            background: var(--gradient-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(123, 47, 190, 0.5);
        }

        /* Адаптивность */
        @media (max-width: 900px) {
            .hero-banner {
                grid-template-columns: 1fr;
                padding: 2rem;
            }

            .program-details {
                grid-template-columns: 1fr;
            }

            .hero-text h1 {
                font-size: 1.8rem;
            }
        }

        @media (max-width: 600px) {
    .page-title {
        font-size: 1.8rem;
        margin: 2rem 0;
    }
    .container {
        padding: 1rem;
    }
    .video-hero {
        height: 70vh;
        min-height: 400px;
    }
    .quote-overlay {
        padding: 1.5rem 1rem;
        max-width: 98%;
        width: 98%;
    }
    .quote-overlay .quote-text {
        font-size: 0.95rem;
        line-height: 1.5;
        margin-bottom: 1.2rem;
        padding: 0 0.5rem;
    }
    .quote-overlay .quote-author {
        font-size: 0.85rem;
        line-height: 1.4;
    }
    .quote-overlay .quote-author span {
        font-size: 0.78rem;
    }
    .quote-decor .decor-circle { width: 200px; height: 200px; top: 5%; right: -15%; }
    .quote-decor .decor-ring { width: 160px; height: 160px; bottom: 3%; left: -15%; border-width: 6px; }
    .quote-decor .decor-triangle { width: 100px; height: 100px; top: 10%; left: -5%; }
    .quote-decor .decor-dot { width: 70px; height: 70px; bottom: 15%; right: 5%; }
    .quote-decor .decor-hex { width: 90px; height: 90px; top: 45%; right: -5%; }

    /* --- БАННЕР: уменьшаем отступы --- */
    .hero-banner {
        padding: 1.5rem 1.25rem;
        gap: 1.25rem;
    }

    /* --- СЛАЙДЕР НА МОБИЛЬНЫХ --- */
    .hero-slider {
        aspect-ratio: 4 / 3;
        min-height: 240px;
        border-radius: 10px;
    }

    .slide {
        font-size: 1.6rem;
    }

    /* Крупные и удобные кнопки для тапа */
    .slider-btn {
        width: 44px;
        height: 44px;
        font-size: 1.4rem;
        border-width: 2px;
        background: rgba(255, 255, 255, 0.35);
    }
    .slider-btn.prev { left: 10px; }
    .slider-btn.next { right: 10px; }

    /* Точки крупнее и с большим отступом снизу */
    .slider-dots {
        bottom: 12px;
        gap: 10px;
    }
    .slider-dot {
        width: 12px;
        height: 12px;
        border-width: 2px;
    }

    /* Счётчик крупнее */
    .slider-counter {
        top: 12px;
        left: 12px;
        padding: 6px 14px;
        font-size: 0.85rem;
    }

    /* Заголовок баннера меньше */
    .hero-text h1 {
        font-size: 1.5rem;

    <script>
        // --- ДАННЫЕ О НАПРАВЛЕНИЯХ ---
        const directions = {
            clay: { color: 'orange', badge: 'Творчество', title: 'Создание изделий из глины', short: 'Лепка из глины: от простых форм до авторских изделий. Развиваем мелкую моторику и чувство материала.', full: 'На занятиях мы знакомимся с глиной как материалом, осваиваем базовые техники лепки, работу с фактурой и декором. Каждый участник создаст своё уникальное изделие, которое можно забрать домой после обжига.', bullets: ['Знакомство с видами глины и инструментами.', 'Базовые техники: жгут, пласт, формовка.', 'Декорирование и роспись изделий.', 'Создание авторского изделия за курс.'], age: 'XX-XX', price: '1600 руб.', image: 'img/1.jpeg' },
            figma: { color: 'blue', badge: 'IT', title: 'Графический дизайн в Figma', short: 'Осваиваем современный инструмент дизайна: интерфейсы, макеты, прототипы и работа с графикой.', full: 'Figma — один из самых популярных инструментов графического дизайна в мире. На занятиях мы научимся создавать макеты сайтов и приложений, работать с типографикой, цветом и сетками, а также делать интерактивные прототипы.', bullets: ['Интерфейс Figma и базовые инструменты.', 'Работа с фигурами, текстом и изображениями.', 'Создание макета сайта или приложения.', 'Интерактивные прототипы и анимация.'], age: 'XX-XX', price: '500 руб.', image: 'img/2.jpeg' },
            flexagon: { color: 'orange', badge: 'Математика', title: 'Необычный флексагон', short: 'Создаём удивительную геометрическую игрушку-трансформер, которая раскрывает секреты математики.', full: 'Флексагон — это бумажный многоугольник, который может менять свою форму и количество сторон при складывании. Это не только увлекательная игрушка, но и наглядный пример математических закономерностей.', bullets: ['История и виды флексагонов.', 'Математика за флексагоном: симметрия и топология.', 'Пошаговое создание своего флексагона.', 'Игры и головоломки с флексагоном.'], age: 'XX-XX', price: '500 руб.', image: 'img/3.jpeg' },
            urban: { color: 'blue', badge: 'Дизайн', title: 'Урбанистический дизайн и дизайн пространства', short: 'Цветоведение, стили, чем граффити отличается от мурала, разбираем что такое МАФ, делаем чертёж и макет городской локации.', full: 'Программа посвящена дизайну городской среды. Мы разберём основы цветоведения и стилей, выясним, чем граффити отличается от мурала, что такое малые архитектурные формы (МАФ). На практике создадим чертёж и макет городской локации.', bullets: ['Основы цветоведения и стилей в дизайне.', 'Граффити vs мурал: в чём разница.', 'Что такое МАФ и зачем они нужны.', 'Чертёж и макет городской локации.'], age: 'XX-XX', price: 'XX руб.', image: 'img/4.jpeg' },
            dreamcity: { color: 'orange', badge: 'Проект', title: 'Создание города мечты', short: 'Придумываем сказочный город с нуля: экономическую структуру, численность населения, законы, карты, мерч и макет места в городе.', full: 'Это проектная программа, где каждый участник или команда придумывает сказочный город с нуля. Мы прорабатываем экономическую структуру, численность населения, законы, рисуем карты, придумываем мерч и делаем макет какого-то места в городе.', bullets: ['Придумываем концепцию города с нуля.', 'Экономическая структура и население.', 'Законы, карты и символика города.', 'Разработка мерча и макета локации.'], age: 'XX-XX', price: 'XX руб.', image: 'img/5.jpeg' },
            boardgames: { color: 'blue', badge: 'Игра', title: 'Настольные игры', short: 'Почти каждое занятие мы создаём игры: от самых простых ходилок и «Крокодила» до большой стратегической игры.', full: 'На занятиях мы изучаем мир настольных игр и создаём свои собственные. Начинаем с простых механик (ходилки, «Крокодил»), постепенно переходя к разработке большой стратегической игры с уникальными правилами.', bullets: ['Изучаем механики настольных игр.', 'Создаём простые игры: ходилки, «Крокодил».', 'Разрабатываем большую стратегическую игру.', 'Играем в свои игры и тестируем их.'], age: 'XX-XX', price: 'XX руб.', image: 'img/6.jpeg' },
            animation: { color: 'orange', badge: 'Краткосрочная', title: 'Краткосрочная программа по мультипликации', short: 'Программа состоит из мастер-классов и упражнений на одно-два занятия. Создаём свои первые анимации.', full: 'Это краткосрочная программа, идеально подходящая для первого знакомства с мультипликацией. Состоит из мастер-классов и упражнений на 1-2 занятия. Участники попробуют себя в роли режиссёра, художника и аниматора.', bullets: ['Основы анимации: кадры и движение.', 'Создание персонажа и фона.', 'Съёмка простого мультфильма.', 'Мастер-классы на 1-2 занятия.'], age: 'XX-XX', price: 'XX руб.', image: 'img/7.jpeg' },
            biology: { color: 'blue', badge: 'Наука', title: 'Биология для маленьких', short: 'Увлекательное знакомство с живой природой для самых юных исследователей.', full: 'Программа создана для самых маленьких исследователей. В игровой форме мы знакомимся с растениями, животными, организмом человека и основами экологии. Много практики и наблюдений.', bullets: ['Живая природа вокруг нас.', 'Растения и животные: кто где живёт.', 'Как устроен человек.', 'Простые опыты и наблюдения.'], age: 'XX-XX', price: 'XX руб.', image: 'img/8.jpeg' },
            personal: { color: 'orange', badge: 'Развитие', title: 'Личностное развитие. Социальное проектирование', short: 'Учимся понимать себя, работать в команде и создавать социально значимые проекты.', full: 'Программа направлена на развитие soft skills: самопознание, коммуникация, работа в команде, лидерство. Вторая часть — социальное проектирование: от идеи до реализации проекта, который меняет мир к лучшему.', bullets: ['Самопознание и уверенность в себе.', 'Коммуникация и работа в команде.', 'Основы социального проектирования.', 'Разработка и защита своего проекта.'], age: 'XX-XX', price: 'XX руб.', image: 'img/9.jpeg' },
            theater: { color: 'blue', badge: 'Творчество', title: 'Театральное мастерство', short: 'Сцена, речь, создание личного образа, этюды. Раскрываем актёрские способности.', full: 'На занятиях мы работаем над сценической речью, пластикой, актёрским мастерством. Учимся создавать личный образ, импровизировать и выступать перед публикой. Много практических упражнений и этюдов.', bullets: ['Сценическая речь и дикция.', 'Актёрское мастерство и этюды.', 'Создание личного образа.', 'Импровизация и выход на сцену.'], age: 'XX-XX', price: 'XX руб.', image: 'img/10.jpeg' },
            blogging: { color: 'orange', badge: 'Медиа', title: 'Основы блогинга', short: 'Как вести свой блог, снимать контент, писать тексты и находить свою аудиторию.', full: 'Программа для тех, кто хочет научиться вести свой блог. Разбираем платформы, форматы контента, основы съёмки и монтажа, написание текстов и продвижение. Каждый участник создаст свой первый контент-план.', bullets: ['Платформы и форматы блогов.', 'Съёмка и монтаж контента.', 'Тексты и работа с аудиторией.', 'Создание личного контент-плана.'], age: 'XX-XX', price: 'XX руб.', image: 'img/11.jpeg' },
            math: { color: 'blue', badge: 'Математика', title: 'Ментальная и олимпиадная математика', short: 'Быстрый счёт в уме, логические задачи и подготовка к олимпиадам.', full: 'Программа сочетает ментальную арифметику (быстрый счёт в уме) и олимпиадную математику. Развиваем логику, нестандартное мышление и готовимся к участию в олимпиадах и конкурсах.', bullets: ['Ментальный счёт: техники и упражнения.', 'Логические задачи и головоломки.', 'Нестандартные методы решения.', 'Подготовка к олимпиадам.'], age: 'XX-XX', price: 'XX руб.', image: 'img/12.jpeg' },
            chemistry: { color: 'orange', badge: 'Химия', title: 'Химия цвета: кислотность и индикаторы', short: 'Разберём основные понятия о кислотности среды и индикаторах. Попробуем получить разные цвета химическим путём — смешивая реактивы.', full: 'На занятии мы разберём основные понятия о кислотности среды и индикаторах. Узнаем, как работают природные и синтетические индикаторы, и попробуем получить разные цвета химическим путём — смешивая реактивы. Безопасно, наглядно и очень красиво!', bullets: ['Что такое кислотность и pH.', 'Природные и синтетические индикаторы.', 'Химические реакции с изменением цвета.', 'Практика: получаем разные цвета.'], age: 'XX-XX', price: 'XX руб.', image: 'img/13.jpeg' },
            bookmarks: { color: 'blue', badge: 'Творчество', title: 'Научные закладки для книг', short: 'Участники познакомятся с основами композиции и простыми приёмами оформления, а затем создадут собственные книжные закладки.', full: 'На занятии участники познакомятся с основами композиции и простыми приёмами оформления, а затем создадут собственные книжные закладки. Мы будем работать с разными визуальными мотивами: учёные и их цитаты, научные символы и коллажи из фрагментов научных журналов, ботанические мотивы и изображения растений. Результат — уникальная закладка, сделанная своими руками, и базовые навыки композиции.', bullets: ['⚛️ Учёные и их известные цитаты.', '🔬 Научные символы и коллажи из фрагментов научных журналов.', '🌿 Ботанические мотивы и изображения растений.', 'Результат: уникальная закладка своими руками и базовые навыки композиции.'], age: 'XX-XX', price: 'XX руб.', image: 'img/14.jpeg' }
        };

        let savedScrollPosition = 0;

        // --- ГЕНЕРАЦИЯ КАРТОЧЕК ---
        function generateCards() {
            const grid = document.getElementById('cards-grid');
            let html = '';
            for (const [key, data] of Object.entries(directions)) {
                html += `
                <div class="card" onclick="showDirection('${key}')">
                    <div class="card-image" style="background-image: url('${data.image}');">
                        <span class="card-badge">${data.badge}</span>
                    </div>
                    <div class="card-content">
                        <h3 class="card-title">${data.title}</h3>
                        <p class="card-desc">${data.short}</p>
                        <div class="card-footer">
                            <span>${data.age}</span>
                            <span class="price">${data.price}</span>
                        </div>
                    </div>
                </div>
                `;
            }
            grid.innerHTML = html;
        }

        // --- ГЕНЕРАЦИЯ СТРАНИЦ НАПРАВЛЕНИЙ СО СЛАЙДЕРОМ ---
        function generateDirectionPages() {
            const container = document.getElementById('direction-pages-container');
            let html = '';
            for (const [key, data] of Object.entries(directions)) {
                const colorClass = data.color === 'orange' ? 'orange' : 'blue';
                const borderStyle = data.color === 'blue' ? 'border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;' : '';
                html += `
                <div id="direction-${key}" class="direction-page">
                    <span class="back-btn" onclick="showMain()">← Назад к мастер-классам</span>
                    <div class="hero-banner ${colorClass}">
                        <div class="bg-graphic" style="${borderStyle}"></div>
                        <div class="hero-text">
                            <span class="hero-badge">${data.badge}</span>
                            <h1>${data.title}</h1>
                            <p>${data.short}</p>
                            <div class="info-box">Стоимость ${data.price} | ${data.age}</div>
                        </div>
                        <div class="hero-image">
                            <div class="hero-slider" data-slider="${key}">
                                <div class="slider-counter"><span class="current">1</span> / 4</div>
                                <div class="slider-track">
                                    <div class="slide slide-1">Слайд 1</div>
                                    <div class="slide slide-2">Слайд 2</div>
                                    <div class="slide slide-3">Слайд 3</div>
                                    <div class="slide slide-4">Слайд 4</div>
                                </div>
                                <button class="slider-btn prev" onclick="slidePrev(event, '${key}')" aria-label="Предыдущий слайд">‹</button>
                                <button class="slider-btn next" onclick="slideNext(event, '${key}')" aria-label="Следующий слайд">›</button>
                                <div class="slider-dots">
                                    <span class="slider-dot active" onclick="slideTo(event, '${key}', 0)"></span>
                                    <span class="slider-dot" onclick="slideTo(event, '${key}', 1)"></span>
                                    <span class="slider-dot" onclick="slideTo(event, '${key}', 2)"></span>
                                    <span class="slider-dot" onclick="slideTo(event, '${key}', 3)"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="program-details">
                        <div>
                            <h2>О программе</h2>
                            <p>${data.full}</p>
                            <br>
                            <h2>Что вас ждет?</h2>
                            <ul>${data.bullets.map(b => `<li>${b}</li>`).join('')}</ul>
                        </div>
                        <div class="sidebar">
                            <h3>Записаться</h3>
                            <p>Оставить заявку можно в нашей группе ВКонтакте.</p>
                            <p><strong>Телефон:</strong><br>+7 (831) 214-03-55</p>
                            <p><strong>Адрес:</strong><br>ул. Ульянова, 10Б</p>
                            <a href="https://vk.ru/kvantorium52" target="_blank" rel="noopener noreferrer" class="btn-gradient">Записаться</a>
                        </div>
                    </div>
                </div>
                `;
            }
            container.innerHTML = html;
        }

        // --- ЛОГИКА СЛАЙДЕРА ---
        const sliderState = {};

        function slideNext(event, key) {
            event.stopPropagation();
            const state = sliderState[key] || { current: 0, total: 4 };
            state.current = (state.current + 1) % state.total;
            sliderState[key] = state;
            updateSlider(key);
        }

        function slidePrev(event, key) {
            event.stopPropagation();
            const state = sliderState[key] || { current: 0, total: 4 };
            state.current = (state.current - 1 + state.total) % state.total;
            sliderState[key] = state;
            updateSlider(key);
        }

        function slideTo(event, key, index) {
            event.stopPropagation();
            const state = sliderState[key] || { current: 0, total: 4 };
            state.current = index;
            sliderState[key] = state;
            updateSlider(key);
        }

        function updateSlider(key) {
            const state = sliderState[key] || { current: 0, total: 4 };
            const slider = document.querySelector(`[data-slider="${key}"]`);
            if (!slider) return;

            const track = slider.querySelector('.slider-track');
            const dots = slider.querySelectorAll('.slider-dot');
            const counter = slider.querySelector('.slider-counter .current');

            track.style.transform = `translateX(-${state.current * 100}%)`;
            dots.forEach((dot, i) => {
                dot.classList.toggle('active', i === state.current);
            });
            if (counter) {
                counter.textContent = state.current + 1;
            }
        }

        // --- НАВИГАЦИЯ ---
        function showMain() {
            const videoHero = document.getElementById('videoHero');
            videoHero.classList.remove('hidden');

            document.getElementById('main-page').style.display = 'block';
            const pages = document.querySelectorAll('.direction-page');
            pages.forEach(page => page.classList.remove('active'));

            requestAnimationFrame(function () {
                requestAnimationFrame(function () {
                    window.scrollTo(0, savedScrollPosition);
                });
            });
        }

        function showDirection(type) {
            savedScrollPosition = window.pageYOffset || document.documentElement.scrollTop;

            const videoHero = document.getElementById('videoHero');
            videoHero.classList.add('hidden');

            document.getElementById('main-page').style.display = 'none';
            const pages = document.querySelectorAll('.direction-page');
            pages.forEach(page => page.classList.remove('active'));
            const target = document.getElementById('direction-' + type);
            if (target) {
                target.classList.add('active');
            }
            window.scrollTo(0, 0);
        }

        // --- ТАЙМЕР ПОЯВЛЕНИЯ ЦИТАТЫ И ФИГУР ---
        function startQuoteTimer() {
            const isMobile = window.innerWidth <= 600;
            const delay = isMobile ? 11000 : 9000;
            setTimeout(function () {
                const quote = document.getElementById('quoteOverlay');
                if (quote) quote.classList.add('visible');
                const decor = document.getElementById('quoteDecor');
                if (decor) decor.classList.add('visible');
            }, delay);
        }

        // --- ИНИЦИАЛИЗАЦИЯ ---
        generateCards();
        generateDirectionPages();

        document.getElementById('main-page').style.display = 'block';

        document.addEventListener('DOMContentLoaded', function () {
            const video = document.getElementById('heroVideo');
            if (video) {
                video.currentTime = 0;
                video.play().catch(function (error) {
                    console.log('Автоплей заблокирован:', error);
                    document.body.addEventListener('click', function () {
                        video.play();
                    }, { once: true });
                });
            }
            startQuoteTimer();
        });
    </script>
</body>

</html>
