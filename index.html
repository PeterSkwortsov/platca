    <style>
        /* --- БАЗОВЫЕ СТИЛИ И ПЕРЕМЕННЫЕ --- */
        :root {
            --orange: #F58220;
            --blue: #2E5A9C;
            --white: #ffffff;
            --dark: #1a1a1a;
            --gray: #f4f4f4;
            --font-main: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--white);
            color: var(--dark);
            line-height: 1.6;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* --- ВИДЕО-БЛОК В САМОМ НАЧАЛЕ --- */
        .video-hero {
            position: relative;
            width: 100%;
            height: 100vh;
            min-height: 500px;
            overflow: hidden;
            background-color: #000;
        }

        .video-hero video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover;
            z-index: 1;
        }

        /* Цитата поверх видео */
        .quote-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
            text-align: center;
            max-width: 900px;
            padding: 2rem 3rem;
            color: var(--dark);
            opacity: 0;
            animation: quoteAppear 2s ease-in-out 9s forwards;
            pointer-events: none;
        }

        .quote-overlay .quote-text {
            font-size: 1.6rem;
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 2rem;
            color: var(--dark);
        }

        .quote-overlay .quote-author {
            font-size: 1.1rem;
            font-weight: 700;
            line-height: 1.4;
            color: var(--dark);
        }

        .quote-overlay .quote-author span {
            display: block;
            font-weight: 400;
            font-size: 1rem;
            margin-top: 0.3rem;
        }

        @keyframes quoteAppear {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.95);
            }

            100% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(1);
            }
        }

        /* --- ГЛАВНАЯ СТРАНИЦА --- */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .page-title {
            text-align: center;
            margin: 3rem 0;
            font-size: 2.5rem;
            text-transform: uppercase;
            font-weight: 800;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-bottom: 4rem;
        }

        /* Карточка на главной */
        .card {
            background: var(--white);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
        }

        .card-image {
            height: 200px;
            background-size: cover;
            background-position: center;
            position: relative;
            background-color: #ddd;
        }

        .card-image::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.2);
        }

        .card-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: var(--white);
            color: var(--dark);
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.8rem;
            text-transform: uppercase;
            z-index: 2;
        }

        .card-content {
            padding: 1.5rem;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .card-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
            line-height: 1.3;
        }

        .card-desc {
            color: #666;
            margin-bottom: 1.5rem;
            flex-grow: 1;
            font-size: 0.95rem;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #eee;
            padding-top: 1rem;
            font-weight: 600;
        }

        .price {
            color: var(--orange);
            font-size: 1.1rem;
        }

        /* --- СТРАНИЦА НАПРАВЛЕНИЯ (ДЕТАЛЬНАЯ) --- */
        .direction-page {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .direction-page.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Баннер в стиле ваших картинок */
        .hero-banner {
            border-radius: 12px;
            padding: 3rem;
            color: var(--white);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            align-items: center;
            position: relative;
            overflow: hidden;
            margin-bottom: 3rem;
        }

        /* Текстура и фоновые элементы */
        .hero-banner::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: radial-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 20px 20px;
            pointer-events: none;
        }

        .hero-banner.orange {
            background-color: var(--orange);
        }

        .hero-banner.blue {
            background-color: var(--blue);
        }

        .hero-banner .bg-graphic {
            position: absolute;
            top: -50px;
            right: -50px;
            width: 400px;
            height: 400px;
            border: 20px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            pointer-events: none;
        }

        .hero-text h1 {
            font-size: 2.2rem;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 1.5rem;
            line-height: 1.2;
        }

        .hero-text p {
            font-size: 1.1rem;
            margin-bottom: 2rem;
            opacity: 0.95;
        }

        .hero-image img {
            width: 100%;
            border-radius: 8px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            background-color: rgba(255, 255, 255, 0.1);
            min-height: 250px;
            object-fit: cover;
        }

        .hero-badge {
            display: inline-block;
            border: 2px solid var(--white);
            padding: 5px 20px;
            border-radius: 30px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }

        .info-box {
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid var(--white);
            border-radius: 8px;
            padding: 1rem 2rem;
            display: inline-block;
            margin-top: 1rem;
            font-weight: bold;
            font-size: 1.1rem;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 2rem;
            color: #666;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.3s;
        }

        .back-btn:hover {
            color: var(--orange);
        }

        /* Детали программы */
        .program-details {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 3rem;
        }

        .program-details h2 {
            font-size: 1.6rem;
            margin-bottom: 1rem;
            text-transform: uppercase;
        }

        .program-details ul {
            list-style: none;
            margin-bottom: 2rem;
        }

        .program-details li {
            margin-bottom: 0.8rem;
            padding-left: 1.5rem;
            position: relative;
        }

        .program-details li::before {
            content: '✓';
            position: absolute;
            left: 0;
            color: var(--orange);
            font-weight: bold;
        }

        .sidebar {
            background: var(--white);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
            height: fit-content;
        }

        .sidebar h3 {
            margin-bottom: 1rem;
            font-size: 1.3rem;
        }

        .sidebar p {
            margin-bottom: 1rem;
            color: #555;
        }

        /* Адаптивность */
        @media (max-width: 900px) {
            .hero-banner {
                grid-template-columns: 1fr;
                padding: 2rem;
            }

            .program-details {
                grid-template-columns: 1fr;
            }

            .hero-text h1 {
                font-size: 1.8rem;
            }

            .quote-overlay {
                padding: 1.5rem;
                max-width: 95%;
            }

            .quote-overlay .quote-text {
                font-size: 1.2rem;
            }

            .quote-overlay .quote-author {
                font-size: 0.95rem;
            }
        }

        @media (max-width: 600px) {
            .page-title {
                font-size: 1.8rem;
            }

            .container {
                padding: 1rem;
            }

            .quote-overlay .quote-text {
                font-size: 1rem;
            }

            .quote-overlay .quote-author {
                font-size: 0.85rem;
            }
        }
    </style>
</head>

        // --- ГЕНЕРАЦИЯ КАРТОЧЕК НА ГЛАВНОЙ ---
        function generateCards() {
            const grid = document.getElementById('cards-grid');
            let html = '';

            for (const [key, data] of Object.entries(directions)) {
                html += `
                <div class="card" onclick="showDirection('${key}')">
                    <div class="card-image" style="background-image: url('${data.image}');">
                        <span class="card-badge">${data.badge}</span>
                    </div>
                    <div class="card-content">
                        <h3 class="card-title">${data.title}</h3>
                        <p class="card-desc">${data.short}</p>
                        <div class="card-footer">
                            <span>${data.age}</span>
                            <span class="price">${data.price}</span>
                        </div>
                    </div>
                </div>
                `;
            }

            grid.innerHTML = html;
        }

        // --- ГЕНЕРАЦИЯ СТРАНИЦ НАПРАВЛЕНИЙ ---
        function generateDirectionPages() {
            const container = document.getElementById('direction-pages-container');
            let html = '';

            for (const [key, data] of Object.entries(directions)) {
                const colorClass = data.color === 'orange' ? 'orange' : 'blue';
                const borderStyle = data.color === 'blue'
                    ? 'border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;'
                    : '';

                html += `
                <div id="direction-${key}" class="direction-page">
                    <span class="back-btn" onclick="showMain()">← Назад к программам</span>
                    
                    <div class="hero-banner ${colorClass}">
                        <div class="bg-graphic" style="${borderStyle}"></div>
                        <div class="hero-text">
                            <span class="hero-badge">${data.badge}</span>
                            <h1>${data.title}</h1>
                            <p>${data.short}</p>
                            <div class="info-box">
                                Стоимость ${data.price} | ${data.age}
                            </div>
                        </div>
                        <div class="hero-image">
                            <img src="${data.image}" alt="${data.title}">
                        </div>
                    </div>

                    <div class="program-details">
                        <div>
                            <h2>О программе</h2>
                            <p>${data.full}</p>
                            <br>
                            <h2>Что вас ждет?</h2>
                            <ul>
                                ${data.bullets.map(b => `<li>${b}</li>`).join('')}
                            </ul>
                        </div>
                        <div class="sidebar">
                            <h3>Записаться</h3>
                            <p>Оставить заявку можно по телефону или через Навигатор дополнительного образования.</p>
                            <p><strong>Телефон:</strong><br>+7 (831) 214-03-55</p>
                            <p><strong>Адрес:</strong><br>ул. Ульянова, 10Б</p>
                            <button style="width:100%; padding:10px; background:var(--${data.color}); color:white; border:none; border-radius:5px; font-weight:bold; cursor:pointer; margin-top:10px;">Записаться</button>
                        </div>
                    </div>
                </div>
                `;
            }

            container.innerHTML = html;
        }

        // --- НАВИГАЦИЯ ---
        function showMain() {
            document.getElementById('main-page').style.display = 'block';
            const pages = document.querySelectorAll('.direction-page');
            pages.forEach(page => page.classList.remove('active'));
            window.scrollTo(0, 0);
        }

        function showDirection(type) {
            document.getElementById('main-page').style.display = 'none';

            const pages = document.querySelectorAll('.direction-page');
            pages.forEach(page => page.classList.remove('active'));

            const target = document.getElementById('direction-' + type);
            if (target) {
                target.classList.add('active');
            }
            window.scrollTo(0, 0);
        }

        // --- ИНИЦИАЛИЗАЦИЯ ---
        generateCards();
        generateDirectionPages();
        showMain();

        // --- ПРИНУДИТЕЛЬНЫЙ ЗАПУСК ВИДЕО (обход блокировки автоплея) ---
        document.addEventListener('DOMContentLoaded', function () {
            const video = document.getElementById('heroVideo');
            if (video) {
                video.play().catch(function (error) {
                    console.log('Автоплей заблокирован:', error);
                    document.body.addEventListener('click', function () {
                        video.play();
                    }, { once: true });
                });
            }
        });
    </script>
